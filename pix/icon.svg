<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Gradient Background -->
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Hexagonal Shield Shape -->
  <path d="M50 5 L90 25 V75 L50 95 L10 75 V25 L50 5Z" fill="url(#bg_grad)" stroke="#1D4ED8" stroke-width="2"/>

  <!-- The Learning Journey Path (Refined Flow) -->
  <path d="M30 75 C 30 75, 40 50, 60 55 C 80 60, 70 30, 70 30" stroke="white" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8" opacity="0.6"/>
  <path d="M30 75 C 30 75, 40 50, 60 55 C 80 60, 70 30, 70 30" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Glowing Map Nodes -->
  <circle cx="30" cy="75" r="5" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="58" cy="55" r="5" fill="#F59E0B" filter="url(#glow)"/>
  
  <!-- The Goal (Compass/Star Hybrid) -->
  <path d="M70 30 L74 38 L82 38 L76 44 L78 52 L70 47 L62 52 L64 44 L58 38 L66 38 Z" fill="#FBBF24" filter="url(#glow)"/>
  
  <!-- Subtle Overlay for depth -->
  <path d="M50 5 L90 25 L50 45 L10 25 L50 5Z" fill="white" opacity="0.05"/>
</svg>
